[project]
name = "command-engine"
version = "0.1.0"
description = "Governance runtime for multi-AI operations. Built on MO§ES™."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "mcp>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "anthropic>=0.25,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".repo/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
